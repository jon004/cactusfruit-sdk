
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cactusfruit-sdk"
version = "0.1.1"
description = "Python SDK for Cactusfruit model services"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["cactusfruit"]
